name: Release

# Запуск: git tag v1.0.3 && git push origin v1.0.3  (или скриптом publish.bat)
# Тег с дефисом (v1.0.3-beta.1) публикуется как пререлиз.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10 / 11: PySide6
          - flavor: modern
            python: "3.12"
            req: requirements.txt
            pyinstaller: pyinstaller
            exe: ZapretGUI
            setup: ZapretGUI-Setup
          # Windows 7: Python 3.8 + PySide2
          - flavor: win7
            python: "3.8"
            req: requirements-win7.txt
            pyinstaller: pyinstaller==5.13.2
            exe: ZapretGUI-Win7
            setup: ZapretGUI-Win7-Setup
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Версия и репозиторий из тега
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.py -Encoding utf8 -Value @("VERSION = `"$v`"", "APP_REPO = `"${{ github.repository }}`"")
          "APP_VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Зависимости
        run: python -m pip install -r ${{ matrix.req }} ${{ matrix.pyinstaller }}

      - name: Сборка ${{ matrix.exe }}.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --icon icon.ico --add-data "icon.ico;." --name ${{ matrix.exe }} main.py

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:APP_VER" "/DExeSrc=dist\${{ matrix.exe }}.exe" "/DOutName=${{ matrix.setup }}" installer.iss
          Compress-Archive -Path "installer\${{ matrix.setup }}.exe" -DestinationPath "installer\${{ matrix.setup }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.flavor }}
          path: |
            dist/${{ matrix.exe }}.exe
            installer/${{ matrix.setup }}.exe
            installer/${{ matrix.setup }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/**
