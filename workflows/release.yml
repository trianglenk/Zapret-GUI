name: Release

# Запуск: git tag v1.0.3.1 && git push origin v1.0.3.1  (или скриптом publish.bat)
# Тег с дефисом (v1.0.3.1-beta.1) публикуется как пререлиз.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия и репозиторий из тега
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path version.py -Encoding utf8 -Value @("VERSION = `"$v`"", "APP_REPO = `"${{ github.repository }}`"")
          "APP_VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Сборка ZapretGUI.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --icon icon.ico --add-data "icon.ico;." --name ZapretGUI main.py

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:APP_VER" "/DExeSrc=dist\ZapretGUI.exe" "/DOutName=ZapretGUI-Setup" installer.iss
          Compress-Archive -Path "installer\ZapretGUI-Setup.exe" -DestinationPath "installer\ZapretGUI-Setup.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/ZapretGUI.exe
            installer/ZapretGUI-Setup.exe
            installer/ZapretGUI-Setup.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: artifacts/**
